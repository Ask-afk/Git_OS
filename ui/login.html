<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock Daywell</title><link rel="stylesheet" href="login.css"><script defer src="login.js"></script></head>
<body><main><div class="mark" aria-hidden="true">◒</div><p class="eyebrow">DAYWELL OS</p><h1 id="heading">Welcome home</h1><p id="intro">Enter your password to open your tablet.</p>
<form id="form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="256" required autofocus>
<div id="confirm-wrap" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256"></div>
<p id="message" role="status" aria-live="polite"></p><button type="submit" id="submit">Unlock</button></form></main></body></html>
