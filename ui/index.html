<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daywell OS</title><link rel="stylesheet" href="style.css"><script defer src="brand.js"></script><script defer src="app.js"></script></head><body>
<header><div id="clockbox"><time id="clock"></time><span id="date"></span></div><button id="back" hidden>← Go back</button><div class="weather"><span aria-hidden="true">☀</span><div><b>28°C Sunny</b><small>Sample weather</small></div></div><div class="header-actions"><button id="help">Help / SOS</button><button id="lock" aria-label="Lock Daywell">Lock</button></div></header>
<main id="screen"></main><footer><span class="wordmark"><svg viewBox="0 0 40 30" aria-hidden="true"><path d="M3 24h34M8 20a12 12 0 0 1 24 0M20 2v3M4 10l3 2m29-2-3 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span id="brand"></span></span><span id="location">Home screen</span></footer>
<dialog id="confirm"><h2 id="question"></h2><div class="controls"><button id="yes">Yes, call</button><button id="no">No, cancel</button></div></dialog></body></html>
